name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze scripts
        shell: pwsh
        run: |
          # Only the toolkit scripts at the repository root are analyzed:
          # tests/ is skipped on purpose because the harness mocks built-in
          # commands such as Get-Item and Remove-Item.
          $scripts = @(Get-ChildItem -Path . -File | Where-Object { $_.Extension -in '.ps1', '.psd1' })
          $results = @($scripts | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1 })

          if ($results.Count -gt 0) {
            $table = $results |
              Select-Object RuleName, Severity, ScriptName, Line, Message |
              Format-Table -AutoSize |
              Out-String -Width 200
            Write-Host $table
            $table | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            Write-Host "No issues found."
          }

          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) {
            Write-Error "PSScriptAnalyzer reported $($errors.Count) error(s)."
            exit 1
          }

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test harness
        shell: pwsh
        run: ./tests/run-tests.ps1
