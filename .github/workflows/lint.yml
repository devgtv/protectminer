name: Lint PowerShell

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze scripts
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)

          if ($results.Count -gt 0) {
            $table = $results |
              Select-Object RuleName, Severity, ScriptName, Line, Message |
              Format-Table -AutoSize |
              Out-String -Width 200
            Write-Host $table
            $table | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            Write-Host "No issues found."
          }

          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) {
            Write-Error "PSScriptAnalyzer reported $($errors.Count) error(s)."
            exit 1
          }
